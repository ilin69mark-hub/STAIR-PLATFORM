<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STAIR PLATFORM — лестницы на заказ</title>
    <meta
      name="description"
      content="Проектирование и изготовление лестниц на заказ: прямые марши, винтовые, Г- и П-образные. Онлайн-расчёт стоимости, 2D/3D проект, выезд замерщика."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://stair-platform.ru/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph (S3-1, SEO аудит-план) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STAIR PLATFORM" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://stair-platform.ru/" />
    <meta property="og:title" content="STAIR PLATFORM — лестницы на заказ" />
    <meta
      property="og:description"
      content="Проектирование и изготовление лестниц на заказ: прямые марши, винтовые, Г- и П-образные. Онлайн-расчёт стоимости, 2D/3D проект, выезд замерщика."
    />
    <meta name="twitter:card" content="summary" />

    <!-- structured data: Organization + LocalBusiness (контакты синхронны с src/config.ts) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "LocalBusiness"],
        "name": "STAIR PLATFORM",
        "description": "Проектирование и изготовление лестниц на заказ: прямые марши, винтовые, Г- и П-образные.",
        "url": "https://stair-platform.ru/",
        "logo": "https://stair-platform.ru/favicon.svg",
        "telephone": "+7 (___) ___-__-__",
        "email": "info@stair-platform.ru",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Ленинградский проспект, 36с1",
          "addressLocality": "Москва",
          "addressCountry": "RU"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "telephone": "+7 (___) ___-__-__",
          "email": "info@stair-platform.ru",
          "availableLanguage": "ru"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
