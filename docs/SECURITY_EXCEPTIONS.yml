# =============================================================================
# SECURITY_EXCEPTIONS — реестр принятых рисков «требует человека» (список A).
# Формат: YAML (строго парсится скриптом + читается людьми). Один файл —
# единственное место решений; в коде рядом с местом — только короткий маркер
#   // AUDIT-EXCEPTION(E01): <слаг>, см. docs/SECURITY_EXCEPTIONS.yml
#   (# — для yml/sh/conf/env; пример маркера здесь намеренно БЕЗ кода: E00)
#
# Контракт будущего аудита (человек или скрипт):
#   1. Сначала прочитать этот реестр; совпавшие файл:строка+ID — пропустить.
#   2. Остальное проверять как обычно (реестр — не индульгенция на новое).
# Контракт CI: hack/check_audit_exceptions.py — каждый маркер AUDIT-EXCEPTION
#   в коде обязан иметь парный ID в реестре, иначе fail. Проверка живёт в
#   джобе lint (.github/workflows/ci.yml).
# Правила ведения:
#   - ID стабильны (E01..): запись не удалять, а закрывать (status: lifted +
#     lifted_at/после чего). Нумерация только растёт.
#   - requires_human: true — без срока, но prod_gate обязателен: прод без
#     этого НЕ запускать (проверяется чек-листом релиза вручную).
#   - Поля записи: id | title | anchors (file+line маркеров) | risk |
#     why | accepted_by | accepted_at | requires_human | prod_gate |
#     lift_condition | status (active|lifted).
# Отклонение от doc-conventions: лежит в корне docs/ (а не 16_SECURITY/) —
#   осознанно: стабильный короткий путь для CI-скрипта, аудиторов и маркеров.
# =============================================================================

