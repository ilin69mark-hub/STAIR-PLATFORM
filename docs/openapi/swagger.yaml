  # Нестандартные RPC-маршруты с ":" в пути (см. x-rpc-routes) не могут быть ключами paths в OpenAPI 3.
x-rpc-routes:
  - "POST /stairs:calculate"
  - "POST /stairs:calculate/async"
  - "POST /stairs:optimize"
  - "POST /stairs:validate"
  - "POST /public/stairs:quote"
  - "POST /public/stairs:validate"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: "bearer"
      description: "Токен из ответа /auth/login или API-ключ"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Описание ошибки
        request_id:
          type: string
          description: Идентификатор запроса для поддержки
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
