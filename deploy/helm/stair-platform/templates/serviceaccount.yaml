{{- /*
ServiceAccount для api и worker.

INF (2026-09-26): values.yaml объявлял `serviceAccount.create: true`, а оба
деплоймента ссылались на `serviceAccountName`, но шаблона ServiceAccount не
было. В кластере с admission-контроллером ServiceAccount поды отклоняются
(CreateContainerConfigError), rollout не становится ready, а `helm upgrade
--atomic` откатывает релиз — то есть CD не мог задеплоить ничего.

automountServiceAccountToken: false — сервису не нужны обращения к API
Kubernetes, токен не должен попадать в под.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stair-platform.serviceAccountName" . }}
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
