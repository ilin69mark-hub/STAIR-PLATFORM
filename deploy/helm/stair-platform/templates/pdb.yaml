{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stair-platform.fullname" . }}
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "stair-platform.selectorLabels" . | nindent 6 }}
      # INF (2026-09-26): селектор был только {name,instance}, а воркер
      # добавляет component: worker, из-за чего PDB матчил 3 пода (2 api +
      # 1 worker) при minAvailable: 1 — дренаж одного узла выбивал ОБЕ
      # реплики API. Теперь PDB защищает только api; у worker свой PDB.
      app.kubernetes.io/component: api
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  {{- if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end }}
{{- end }}