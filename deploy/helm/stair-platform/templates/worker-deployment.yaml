apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stair-platform.fullname" . }}-worker
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stair-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stair-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stair-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "stair-platform.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/worker"]
          envFrom:
            - configMapRef:
                name: {{ include "stair-platform.fullname" . }}-config
          env:
            - name: STAIR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: database-url
            # S-105: secretsKey обязателен (required в secret.yaml) — env всегда.
            - name: STAIR_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: secrets-key
            {{- if and .Values.sso .Values.sso.clientSecret }}
            # INF-12: OAuth-секрет приходит из Secret, а не из ConfigMap.
            - name: STAIR_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: sso-client-secret
            {{- end }}
          # S2-1: worker пишет только в ТЗ БД/Redis; /tmp — tmpfs (RO root).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # INF-10 (forensic 2026-09-27): `toYaml X | default Y` НЕ работает
          # как задумано, когда X отсутствует: toYaml nil возвращает строку
          # "null", а default срабатывает только на пустом значении — "null"
          # непусто, поэтому подставлялось `resources:\n  null` (подтверждено
          # `helm template`). Воркер уходил в BestEffort без limits: первым
          # вытеснялся при давлении на ноду, утечка не ограничена.
          #
          # default обязан быть ВНУТРИ скобок toYaml. Порядок важен: сначала
          # выбираем источник (worker.resources → общий resources), потом
          # сериализуем.
          resources:
            {{- toYaml (.Values.worker.resources | default .Values.resources) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}