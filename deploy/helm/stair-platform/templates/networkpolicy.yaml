{{- /*
NetworkPolicy (S-149, S-141 №12, CIS 5.3): сегментация трафика — скомпрометированный
под не должен ходить в БД/Redis/интернет и принимать входы кроме разрешённых.

Модель (две политики, обе — на поды релиза, selectorLabels):
  1. <fullname>-default-deny — Ingress+Egress deny-all;
  2. <fullname>-allow — точечные разрешения поверх deny:
     - Ingress :service.port — из подов релиза (api↔worker) + ingressCIDRs
       (контроллер/LB; за ingress-nginx укажите его pod-CIDR);
     - Egress DNS :53 (kube-system/kube-dns) — иначе не резолвятся имена;
     - Egress databaseCIDRs:databasePort (RDS/Cloud SQL) и redisCIDRs:redisPort
       (ElastiCache/Memorystore) — БД/Redis внешние, podSelector невозможен;
     - Egress 0.0.0.0/0:443 — Stripe API + OpenRouter (PSP/LLM), флагом
       egressInternet (выкл — только если внешний PSP/LLM не используется).

По умолчанию ВЫКЛЮЧЕНО (enabled: false): корректные CIDR знает только оператор
среды, а default-deny с пустыми CIDR сломает прод на первом upgrade. Включать
осознанно: staging → сверка коннектов → прод (runbook: REPORTS/builder-S149.md).
Кластеры с CNI без поддержки NP игнорируют политики безвредно.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stair-platform.fullname" . }}-default-deny
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stair-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stair-platform.fullname" . }}-allow
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stair-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API-порт: внутри релиза + ingress-контроллер.
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
      from:
        - podSelector:
            matchLabels:
              {{- include "stair-platform.selectorLabels" . | nindent 14 }}
        {{- range .Values.networkPolicy.ingressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
  egress:
    # DNS обязателен (имена БД/PSP/LLM).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # PostgreSQL (внешний — RDS/Cloud SQL): CIDR обязателен при enabled.
    {{- if not .Values.networkPolicy.databaseCIDRs }}
    {{- fail "networkPolicy.databaseCIDRs is required when networkPolicy.enabled (RDS/Cloud SQL CIDRs)" }}
    {{- end }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
      to:
        {{- range .Values.networkPolicy.databaseCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    # Redis (внешний — ElastiCache/Memorystore).
    {{- if not .Values.networkPolicy.redisCIDRs }}
    {{- fail "networkPolicy.redisCIDRs is required when networkPolicy.enabled (ElastiCache/Memorystore CIDRs)" }}
    {{- end }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.redisPort }}
      to:
        {{- range .Values.networkPolicy.redisCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    {{- if .Values.networkPolicy.egressInternet }}
    # HTTPS наружу: Stripe API + OpenRouter. Выключать только если внешний
    # PSP/LLM не используется (иначе вебхуки/комментарии модели встанут).
    - ports:
        - protocol: TCP
          port: 443
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
    {{- end }}
    {{- range .Values.networkPolicy.extraEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
{{- end }}
