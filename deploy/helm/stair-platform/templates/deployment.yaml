apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stair-platform.fullname" . }}
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stair-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stair-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stair-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "stair-platform.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # INF (2026-09-26): миграции выполняются при старте пода
          # (cmd/api/main.go), а 000031 делает ADD CONSTRAINT с полным
          # сканированием пяти таблиц. С прежними параметрами (liveness
          # initialDelay 30s) медленная БД давала CrashLoop: под не успевал
          # применить миграции и попадал под liveness-килл. startupProbe даёт
          # до 5 минут только на старт, liveness начинает отсчитывать после.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # S-121: при остановке поды должны успеть доотдать WS-события.
          terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
          {{- with .Values.topologySpreadConstraints }}
          topologySpreadConstraints:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "stair-platform.fullname" . }}-config
          env:
            - name: STAIR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: database-url
            # S-105: secretsKey обязателен (required в secret.yaml) — env всегда.
            - name: STAIR_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: secrets-key
            {{- if and .Values.sso .Values.sso.clientSecret }}
            # INF-12: OAuth-секрет приходит из Secret, а не из ConfigMap.
            - name: STAIR_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: sso-client-secret
            {{- end }}
            {{- if .Values.payments.stripeSecretKey }}
            - name: STAIR_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: stripe-secret-key
            - name: STAIR_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stair-platform.fullname" . }}-secrets
                  key: stripe-webhook-secret
            {{- end }}
          # S2-1: при readOnlyRootFilesystem — tmpfs для /tmp и emptyDir для storage.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: {{ .Values.storage.dir }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # S2-1: writable-точки fs (RO root).
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: storage
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
