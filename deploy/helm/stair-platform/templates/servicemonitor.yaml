# S-126: ServiceMonitor для kube-prometheus-stack (опционально).
# Рендерится только при monitoring.serviceMonitor.enabled=true (оператор
# prometheus-operator должен быть установлен в кластере). Метрики уже
# отдаются на :8080/metrics (ClusterIP-only, S-113); скрейп идёт внутри
# кластера, наружу ничего не публикуется.
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stair-platform.fullname" . }}
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "stair-platform.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
