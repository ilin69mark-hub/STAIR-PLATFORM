apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stair-platform.fullname" . }}-secrets
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ .Values.database.url | b64enc | quote }}
  # S-105: secretsKey обязателен — fail-fast при рендере, если пуст.
  secrets-key: {{ required "secretsKey is required (S-105): set --set secretsKey=<64-hex> or in values" .Values.secretsKey | b64enc | quote }}
  {{- if .Values.sso }}
  {{- if .Values.sso.clientSecret }}
  # INF-12 (forensic 2026-09-27): OAuth-клиентский секрет перенесён из
  # ConfigMap в Secret. Раньше он попадал в `kubectl get configmap -o yaml`
  # открытым текстом, тогда как secretsKey и Stripe-ключи уже лежали в Secret —
  # то есть секрет был наименее защищённым из всех при равном уровне доступа.
  sso-client-secret: {{ .Values.sso.clientSecret | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.funnel.visitorSalt }}
  # Соль псевдонима посетителя (воронка витрины, миграция 000035). По ней
  # считаются уникальные посетители. НЕ обязательна: без неё api считает, что
  # идентификация выключена, и отчёт прямо говорит об этом, а не показывает
  # «посетителей: 0». Пустая соль — осознанный режим приватности, поэтому
  # fail-fast здесь был бы неуместен (в отличие от secretsKey ниже).
  funnel-visitor-salt: {{ .Values.funnel.visitorSalt | b64enc | quote }}
  {{- end }}
  {{- if .Values.payments.stripeSecretKey }}
  stripe-secret-key: {{ .Values.payments.stripeSecretKey | b64enc | quote }}
  stripe-webhook-secret: {{ .Values.payments.stripeWebhookSecret | b64enc | quote }}
  {{- end }}
