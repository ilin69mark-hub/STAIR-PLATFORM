apiVersion: v1
kind: Service
metadata:
  name: {{ include "stair-platform.fullname" . }}
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # INF-11 (forensic 2026-09-27): только api. Обычный selectorLabels матчил
  # ещё и воркер (component: worker), который HTTP не слушает, — часть трафика
  # на ClusterIP уходила в под без listener'а. Подробности в _helpers.tpl.
  selector:
    {{- include "stair-platform.apiSelectorLabels" . | nindent 4 }}
