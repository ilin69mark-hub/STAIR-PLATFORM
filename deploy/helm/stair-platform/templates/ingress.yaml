{{- if .Values.ingress.enabled -}}
# S-125: Ingress для API (раньше values.ingress был мёртвым конфигом —
# шаблона не существовало). Покрывает /api/ и /ws,/ws/admin (S-121/S-132);
# /metrics,/swagger,/debug/pprof остаются ClusterIP-only (S-113).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stair-platform.fullname" . }}
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "stair-platform.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
