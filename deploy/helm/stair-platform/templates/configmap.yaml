apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stair-platform.fullname" . }}-config
  labels:
    {{- include "stair-platform.labels" . | nindent 4 }}
data:
  STAIR_ENVIRONMENT: {{ .Values.environment | quote }}
  STAIR_HTTP_ADDR: ":{{ .Values.service.port }}"
  STAIR_STORAGE_DIR: {{ .Values.storage.dir | quote }}
  {{- if .Values.webhookAllowHosts }}
  STAIR_WEBHOOK_ALLOW_HOSTS: {{ .Values.webhookAllowHosts | quote }}
  {{- end }}
  STAIR_DB_MAX_CONNS: {{ .Values.database.maxConns | quote }}
  STAIR_DB_MIN_CONNS: {{ .Values.database.minConns | quote }}
  STAIR_DB_MAX_CONN_LIFETIME: {{ .Values.database.maxConnLifetime | quote }}
  STAIR_DB_MAX_CONN_IDLE_TIME: {{ .Values.database.maxConnIdleTime | quote }}
  STAIR_SESSION_TTL: {{ .Values.security.sessionTTL | quote }}
  STAIR_CORS_ORIGINS: {{ .Values.security.corsOrigins | quote }}
  STAIR_HSTS_ENABLED: {{ .Values.security.hstsEnabled | quote }}
  STAIR_COOKIE_SECURE: {{ .Values.security.cookieSecure | quote }}
  {{- if .Values.redis.addr }}
  STAIR_REDIS_ADDR: {{ .Values.redis.addr | quote }}
  {{- end }}
  {{- if .Values.monitoring.tracingEnabled }}
  STAIR_TRACING_ENABLED: "true"
  STAIR_TRACING_ENDPOINT: {{ .Values.monitoring.tracingEndpoint | quote }}
  STAIR_TRACING_SAMPLE_RATE: {{ .Values.monitoring.tracingSampleRate | quote }}
  {{- end }}
  {{- if .Values.debug.logging }}
  STAIR_DEBUG_LOGGING: "true"
  {{- end }}
  {{- /* INF (2026-09-26): лимиты запросов и доверенные прокси не попадали в
       ConfigMap вообще. Последствия: за ingress-nginx заголовок X-Forwarded-For
       не доверялся, поэтому ВСЕ запросы ключевались по IP ingress-пода и
       login-эндпоинт (10/мин) отдавал 429 всему кластеру. Кроме того,
       оператор не мог поднять лимиты без правки шаблона. */}}
  {{- with .Values.rateLimits }}
  STAIR_LOGIN_RATE_LIMIT: {{ .login | quote }}
  STAIR_REGISTER_RATE_LIMIT: {{ .register | quote }}
  STAIR_QUOTE_RATE_LIMIT: {{ .quote | quote }}
  STAIR_VALIDATE_RATE_LIMIT: {{ .validate | quote }}
  STAIR_AUTH_RATE_LIMIT: {{ .auth | default 0 | quote }}
  STAIR_SSO_RATE_LIMIT: {{ .sso | default 0 | quote }}
  {{- end }}
  {{- with .Values.trustedProxies }}
  STAIR_TRUSTED_PROXIES: {{ join "," . | quote }}
  {{- end }}
  {{- /* OIDC: ключи в values были мёртвой конфигурацией — ConfigMap их не
       рендерил, а имена не совпадали с читаемым кодом (STAIR_SSO_ISSUER). */}}
  {{- with .Values.sso }}
  {{- if .issuerUrl }}
  STAIR_SSO_ISSUER: {{ .issuerUrl | quote }}
  {{- end }}
  {{- if .clientId }}
  STAIR_SSO_CLIENT_ID: {{ .clientId | quote }}
  {{- end }}
  {{- /* INF-12 (forensic 2026-09-27): clientSecret сюда НЕ кладём. OAuth-секрет
       в ConfigMap — это его чтение любым, у кого есть право `get configmaps`
       в namespace, и открытым текстом в kubectl describe. В том же релизе
       рядом создаётся настоящий Secret; секрет переехал туда. */}}
  {{- end }}
