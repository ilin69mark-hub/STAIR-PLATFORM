# Default values for stair-platform

replicaCount: 2

# Background worker (separate Deployment; same image, /bin/worker entrypoint)
worker:
  replicaCount: 1
  # INF-10 (forensic 2026-09-27): resources для воркера. До этого ключа не
  # было вовсе, а шаблон подставлял `null` из-за того, что `toYaml nil`
  # возвращает непустую строку "null" и `default` не срабатывал. Воркер
  # оказывался BestEffort без limits — первым вытеснялся при давлении на ноду.
  #
  # Если оставить пустым, применяются общие `resources` ниже (поведение,
  # ожидаемое от шаблона). Задавать имеет смысл отдельно: воркер держит
  # конвейер расчёта в памяти, и его профиль нагрузки отличается от api.
  resources: {}
  # resources:
  #   limits:
  #     cpu: 1000m
  #     memory: 1Gi
  #   requests:
  #     cpu: 250m
  #     memory: 256Mi
# NetworkPolicy (S-149, S-141 №12, CIS Benchmark 5.3): сегментация трафика.
# По умолчанию ВЫКЛЮЧЕНА: корректные CIDR знает только оператор среды, а
# default-deny с пустыми CIDR сломает прод на первом upgrade. Включение:
# staging (helm template --set networkPolicy.enabled=true ... → сверка) → прод.
# При enabled databaseCIDRs/redisCIDRs ОБЯЗАТЕЛЬНЫ (fail-fast в шаблоне).
networkPolicy:
  enabled: false
  # CIDR ingress-контроллера/LB, которым разрешён вход на :service.port
  # (пример: pod-CIDR кластера "10.42.0.0/16").
  ingressCIDRs: []
  # CIDR внешней PostgreSQL (RDS/Cloud SQL), порт databasePort.
  databaseCIDRs: []
  databasePort: 5432
  # CIDR внешнего Redis (ElastiCache/Memorystore), порт redisPort.
  redisCIDRs: []
  redisPort: 6379
  # HTTPS наружу (Stripe API + OpenRouter). Выключать только если внешний
  # PSP/LLM не используется.
  egressInternet: true
  # Дополнительные egress-CIDR (мониторинг, SMTP и т.п.).
  extraEgressCIDRs: []

resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

image:
  repository: ghcr.io/stairplatform/api
  pullPolicy: IfNotPresent
  # S2-3: НЕТ mutable-дефолта «latest». Пустой tag → Chart.AppVersion; CD
  # задаёт image.tag=${{ github.sha }} — образ всегда воспроизводим.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# S2-1: безопасный runtime — pod-level security context. UID 10001 = appuser
# в Dockerfile (adduser -D -H -u 10001 appuser). seccomp RuntimeDefault +
# runAsNonRoot — базовый lockdown k8s.
podSecurityContext:
  fsGroup: 10001
  runAsUser: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# S2-1: container security context — cap drop ALL, RO rootfs (tmpfs для
# /tmp, emptyDir для /data/storage), без escalation.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  # S-125: примеры для ingress-nginx + cert-manager (раскомментировать под прод):
  # annotations:
  #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"  # idle WS-комнаты (S-121)
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
  annotations: {}
  hosts:
    - host: api.stairplatform.com
      paths:
        # S-125: только публичная поверхность — /api/ и WS; /metrics,/swagger,
        # /debug/pprof остаются ClusterIP-only (S-113, InternalOnlyMiddleware).
        - path: /api/
          pathType: Prefix
        - path: /ws
          pathType: Prefix
  # tls:
  #   - secretName: api-stairplatform-tls
  #     hosts:
  #       - api.stairplatform.com
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# PDB (S2-1): защита api от вывода всех реплик при узлах/обновлениях.
pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# Writable-пути при readOnlyRootFilesystem (S2-1): tmpfs для /tmp и emptyDir
# для STAIR_STORAGE_DIR (файлы проектов; в проде рекомендуется PV/S3).
storage:
  dir: /data/storage

nodeSelector: {}
tolerations: []
affinity: {}

# Database configuration
database:
  url: ""
  maxConns: 10
  minConns: 1
  maxConnLifetime: "1h"
  maxConnIdleTime: "30m"

# Redis configuration (optional)
redis:
  addr: ""

# Secrets (S1-2): master key для AES-GCM шифрования webhook-секретов
# (64 hex = 32 bytes). ОБЯЗАТЕЛЕН (S-105): пустое значение = fail-fast при
# helm template/install (required в templates/secret.yaml). Задаётся через
# --set secretsKey=... или values-файл.
secretsKey: ""

# Webhook SSRF allowlist (S1-1): хосты, которым разрешено резолвиться в
# private/loopback (внутренние сервисы). Пустая строка = блок по умолчанию.
webhookAllowHosts: ""

# Environment (S2-1): production блокирует loopback в SSRF-политике воркера.
environment: "production"

# Security (S-105): secure defaults — HSTS и Secure-cookie включены по
# умолчанию (требуют HTTPS на ingress; для локального dev без TLS можно
# осознанно переопределить на false).
security:
  sessionTTL: "86400"
  corsOrigins: "http://localhost:3000,http://localhost:5173"
  hstsEnabled: true
  cookieSecure: true

# Monitoring
monitoring:
  tracingEnabled: false
  tracingEndpoint: ""
  tracingSampleRate: 0.1
  # S-126: скрейп метрик kube-prometheus-stack (ServiceMonitor CRD;
  # оператор должен стоять в кластере). Выключено по умолчанию.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # labels:
    #   release: kube-prometheus-stack

# Debug (NEVER enable in production)
# Сколько ждать завершения graceful shutdown (WS-комнаты, S-121).
terminationGracePeriodSeconds: 45

# Раскладка реплик API по узлам: без этого обе реплики могут сесть на один
# узел, и дренаж убирает весь API одновременно.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: stair-platform
        app.kubernetes.io/component: api

debug:
  logging: false

# Лимиты запросов (INF, 2026-09-26): до правки не рендерились в ConfigMap,
# поэтому оператор не мог их поднять, а за ingress-nginx все запросы
# ключевались по IP пода (см. configmap.yaml и middleware_auth.go).
rateLimits:
  login: 10
  register: 5
  quote: 30
  validate: 120
  auth: 120
  sso: 30

# Доверенные прокси (CIDR ingress-контроллера/LB). Пусто = не доверять
# заголовкам X-Forwarded-* (rate-limit ключуется по IP соединения).
trustedProxies: []

# SSO (OIDC). До правки блок был мёртвой конфигурацией: ConfigMap не
# рендерил эти значения, а имена не совпадали с читаемым кодом.
sso:
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  pprofEnabled: false

# Payments
payments:
  stripeSecretKey: ""
  stripeWebhookSecret: ""

# OIDC (optional, for SSO)
oidc:
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""
