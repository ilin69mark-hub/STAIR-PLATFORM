global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@stair-platform.com'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    # В проде настроить email/slack/telegram
    # email_configs:
    #   - to: 'team@stair-platform.com'

  - name: 'critical'
    # В проде настроить PagerDuty/OpsGenie
    # pagerduty_configs:
    #   - service_key: '<pagerduty-key>'

  - name: 'warning'
    # В проде настроить Slack
    # slack_configs:
    #   - api_url: '<slack-webhook>'
    #     channel: '#alerts'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
