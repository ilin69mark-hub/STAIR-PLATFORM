name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # S2-3: mutable «latest» pinned — воспроизводимый линт при сборке.
          version: v2.13.2

  architecture-checks:
    name: Architecture Fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check layer boundaries (domain must not depend on outer layers)
        run: |
          echo "Checking domain → outer layers imports (forbidden)..."
          VIOLATIONS=$(go list -f '{{.ImportPath}} {{join .Imports " "}}' ./internal/domain/... \
            | grep -E " (stairplatform/internal/(application|engine|transport|infrastructure|geometry))" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Domain packages must not import outer layers (ADR-0006):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK: No forbidden domain imports found"

      - name: Check for cyclic dependencies
        run: |
          echo "Checking for cyclic dependencies..."
          go list -f '{{.ImportPath}}: {{.Deps}}' ./... | grep -c "stairplatform" || true
          echo "OK: Dependency check passed"

      - name: Check package naming
        run: |
          echo "Checking package naming conventions..."
          go vet ./... 2>&1 | grep -i "name" || echo "OK: Package names valid"

      - name: Check infra ownership (S2-2: single owner per resource)
        run: ./scripts/check-infra-ownership.sh

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # БД включается обязательно: без STAIR_TEST_DATABASE_URL весь
      # internal/infrastructure/database (17 integration-файлов) скипается и
      # в CI никогда не исполняется. -p 1 требуется для БД-тестов, иначе
      # golang-migrate ловит «Dirty database version» при параллельных пакетах.
      - name: Run tests (unit + DB integration, -race)
        run: go test -race -p 1 -coverprofile=coverage.out ./... -timeout 25m
        env:
          STAIR_TEST_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_test?sslmode=disable

      # Покрытие-гейт (TEST-0028): порог 85%, повторный прогон не нужен —
      # переиспользуем coverage.out. Если регресс ниже порога — джоба падает.
      - name: Coverage gate (>=85%)
        run: ./scripts/coverage-check.sh 85
        env:
          STAIR_TEST_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_test?sslmode=disable
          COVERAGE_PROFILE: coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  test-frontend-store:
    name: Test Store Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-store
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend-store/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # @shared-исходники живут в frontend/shared, а их зависимости
      # (react, three) резолвятся через frontend/node_modules — ставим и их,
      # иначе tsc -b не находит react для shared-файлов. install вместо ci:
      # lock frontend/ отстаёт от package.json (pre-existing drift).
      - name: Install shared deps (frontend)
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --coverage

  test-frontend-admin:
    name: Test Admin Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --coverage

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run migrations
        run: |
          go run ./cmd/migrate up
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable

      - name: Start API server
        run: |
          go run ./cmd/api &
          sleep 5
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable
          STAIR_HTTP_ADDR: :8080
          STAIR_SESSION_TTL: 86400
          # Дефолты логина/регистрации (10/5 в минуту на IP) малы: тесты
          # регистрируют юзеров с одного IP раннера и ловят 429.
          STAIR_LOGIN_RATE_LIMIT: 100
          STAIR_REGISTER_RATE_LIMIT: 100

      - name: Run E2E tests
        run: go test -v ./tests/e2e/...

  # Матрица 2000 e2e (500/марш): 2000×~15с ≈ 8.3ч серийно → 8 шардов × 250
  # тестов, workers:4 (~16 мин/джоб). Дедупликация учитывает хэш тела,
  # параллельные воркеры не получают ложный 429.
  test-e2e-matrix:
    name: E2E matrix (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-store]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend-store/package-lock.json
            frontend/package-lock.json

      - name: Install store dependencies
        run: npm ci
        working-directory: frontend-store

      # Vite dev отдаёт @shared-исходники из frontend/shared, а three/react
      # для них резолвятся через frontend/node_modules — без них падает
      # dependency scan и вьювер (install вместо ci: lock frontend/ отстаёт,
      # pre-existing drift).
      - name: Install shared deps (frontend)
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend-store

      - name: Run migrations
        run: |
          go run ./cmd/migrate up
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable

      - name: Start API server
        run: |
          go run ./cmd/api &
          sleep 5
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable
          STAIR_HTTP_ADDR: :8080
          STAIR_SESSION_TTL: 86400
          # Матрица шлёт 2000 quote-расчётов параллельно (4 воркера/шард):
          # дефолтный лимит 30/мин на IP выбивает 429 и роняет кейсы.
          STAIR_QUOTE_RATE_LIMIT: 600

      - name: Run matrix shard ${{ matrix.shard }}/8
        run: npx playwright test e2e/tests/quote-matrix-generated.spec.ts --shard=${{ matrix.shard }}/8
        working-directory: frontend-store
        env:
          CI: true

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: frontend-store/blob-report
          retention-days: 7

  # Playwright e2e админ-панели: 11 спеков (кроме report-400 — 400 проектов,
  # ~30 мин, гоняется локально через R400_N). API поднимает сам Playwright
  # webServer (см. frontend/playwright.config.ts), БД — postgres service.
  test-e2e-admin:
    name: E2E Admin (Playwright)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-admin]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable
      # admin-panel.spec повышает роль через psql к postgres service
      STAIR_E2E_PSQL: PGPASSWORD=testpassword psql -h localhost -U stair -d stair_platform_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install psql client (for admin setup)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Run Admin E2E tests
        run: npx playwright test e2e/tests/admin-panel.spec.ts e2e/tests/assistant.spec.ts e2e/tests/boundary.spec.ts e2e/tests/lshape.spec.ts e2e/tests/project-lifecycle.spec.ts e2e/tests/roles-parallel.spec.ts e2e/tests/room-fit-variants.spec.ts e2e/tests/spiral.spec.ts e2e/tests/ui-20.spec.ts e2e/tests/ushape.spec.ts e2e/tests/validation.spec.ts
        working-directory: frontend
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-admin
          path: frontend/playwright-report
          retention-days: 7

  # Playwright e2e клиентского сайта: rails-matrix, room-fit, store.
  # (quote-matrix 2000 живёт в отдельной матричной джобе.)
  test-e2e-store:
    name: E2E Store (Playwright)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-store]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend-store/package-lock.json
            frontend/package-lock.json

      - name: Install store dependencies
        run: npm ci
        working-directory: frontend-store

      # @shared-исходники из frontend/shared резолвят react/three через
      # frontend/node_modules (install вместо ci: lock frontend/ отстаёт).
      - name: Install shared deps (frontend)
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend-store

      - name: Run migrations
        run: go run ./cmd/migrate up
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable

      - name: Start API server
        run: |
          go run ./cmd/api &
          sleep 5
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable
          STAIR_HTTP_ADDR: :8080
          STAIR_SESSION_TTL: 86400
          STAIR_LOGIN_RATE_LIMIT: 100
          STAIR_REGISTER_RATE_LIMIT: 100
          STAIR_QUOTE_RATE_LIMIT: 600

      # store.spec логинится под user@user.ru — создаём его (409 «уже есть»
      # при повторных прогонах — приемлемо и не роняет шаг).
      - name: Seed store e2e user
        run: |
          curl -s -o /dev/null -w '%{http_code}\n' -X POST http://localhost:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"Store E2E","email":"user@user.ru","password":"user1234"}' || true

      - name: Run Store E2E tests
        run: npx playwright test e2e/tests/rails-matrix.spec.ts e2e/tests/room-fit.spec.ts e2e/tests/store.spec.ts
        working-directory: frontend-store
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-store
          path: frontend-store/playwright-report
          retention-days: 7

  load-smoke:
    # S5-2: нагрузочный smoke на каждый PR (k6), пороги в k6/scripts/smoke.js
    # (validate p95<500ms, http_req_failed rate<0.01 abortOnFail). Полный
    # нагрузочный прогон — nightly-load.yml на staging.
    name: k6 smoke on PR (S5-2)
    runs-on: ubuntu-latest
    needs: [test-backend]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.53.0"

      - name: Run migrations
        run: go run ./cmd/migrate up
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable

      - name: Start API server
        run: |
          go run ./cmd/api &
          sleep 5
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable
          STAIR_HTTP_ADDR: :8080
          STAIR_SESSION_TTL: 86400
          STAIR_LOGIN_RATE_LIMIT: 100
          STAIR_REGISTER_RATE_LIMIT: 100
          STAIR_QUOTE_RATE_LIMIT: 600
          # S5-2: validate — публичный эндпоинт; для perf-smoke в ephemeral API
          # лимит 600/мин выбивался бы 20 VU за секунды → уводим, дефолт/прод
          # не трогаем (в проде smoke ограничен реальным validate_rate_limit).
          STAIR_VALIDATE_RATE_LIMIT: 100000

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && exit 0
            sleep 2
          done
          echo "api not healthy" >&2
          exit 1

      - name: Run k6 smoke (validate p95<500ms, 0 failed)
        run: k6 run --summary-trend-stats="avg,min,med,p(95),p(99),max" k6/scripts/smoke.js
        env:
          BASE_URL: http://localhost:8080

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Run Gitleaks (secret scan, полная история)
        run: |
          docker run --rm -v "$PWD:/src" -w /src zricethezav/gitleaks:v8.30.1 \
            detect --source=/src --config=/src/.gitleaks.toml --no-banner

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # gosec и trivy-action закреплены на стабильных тегах (supply-chain):
      # «@master» привязал бы к mutable-ветке и ломал воспроизводимость.
      - name: Run gosec
        uses: securego/gosec@v2.28.1
        with:
          args: ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend-store, test-frontend-admin]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repo name for GHCR (must be lowercase)
        id: repo
        run: echo "image_repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Get build time
        id: buildtime
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push API
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deployments/Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.time }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.image_repo }}/api:latest
            ghcr.io/${{ steps.repo.outputs.image_repo }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Store
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deployments/store.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.image_repo }}/store:latest
            ghcr.io/${{ steps.repo.outputs.image_repo }}/store:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deployments/admin.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.image_repo }}/admin:latest
            ghcr.io/${{ steps.repo.outputs.image_repo }}/admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
