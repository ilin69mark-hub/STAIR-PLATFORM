# STAIR PLATFORM — CI Baseline (DEV-0010)
# Pipeline: Format → Lint → Static Analysis → Unit Tests → Build → Security/Dependency Checks

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Пин v2: «latest» в action ставит v1.64.8 (собран с go1.24) и падает
          # на go1.26.2. v2.12.2 собран с go1.26.2 — совместим с go.mod
          # (v2 требует golangci-lint-action v7).
          version: v2.12.2

      - name: Dependencies (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Unit Tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build
        run: go build ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # MVP-10: юнит-тесты, линт и сборка фронтенда.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  # MVP-10: интеграционные тесты HTTP + PostgreSQL (реальный стек).
  integration:
    name: Integration (HTTP+DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: stair
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration Tests
        run: go test ./...
        env:
          STAIR_TEST_DATABASE_URL: postgres://stair:stair@localhost:5432/stair_platform_test?sslmode=disable