name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  architecture-checks:
    name: Architecture Fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check layer boundaries (domain must not depend on outer layers)
        run: |
          echo "Checking domain → outer layers imports (forbidden)..."
          VIOLATIONS=$(go list -f '{{.ImportPath}} {{join .Imports " "}}' ./internal/domain/... \
            | grep -E " (stairplatform/internal/(application|engine|transport|infrastructure|geometry))" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Domain packages must not import outer layers (ADR-0006):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK: No forbidden domain imports found"

      - name: Check for cyclic dependencies
        run: |
          echo "Checking for cyclic dependencies..."
          go list -f '{{.ImportPath}}: {{.Deps}}' ./... | grep -c "stairplatform" || true
          echo "OK: Dependency check passed"

      - name: Check package naming
        run: |
          echo "Checking package naming conventions..."
          go vet ./... 2>&1 | grep -i "name" || echo "OK: Package names valid"

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./... -timeout 15m

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  test-frontend-store:
    name: Test Store Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend-store/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # @shared-исходники живут в frontend/shared, а их зависимости
      # (react, three) резолвятся через frontend/node_modules — ставим и их,
      # иначе tsc -b не находит react для shared-файлов. install вместо ci:
      # lock frontend/ отстаёт от package.json (pre-existing drift).
      - name: Install shared deps (frontend)
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --coverage

  test-frontend-admin:
    name: Test Admin Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --coverage

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run migrations
        run: |
          go run ./cmd/migrate up
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable

      - name: Start API server
        run: |
          go run ./cmd/api &
          sleep 5
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable
          STAIR_HTTP_ADDR: :8080
          STAIR_SESSION_TTL: 86400
          # Дефолты логина/регистрации (10/5 в минуту на IP) малы: тесты
          # регистрируют юзеров с одного IP раннера и ловят 429.
          STAIR_LOGIN_RATE_LIMIT: 100
          STAIR_REGISTER_RATE_LIMIT: 100

      - name: Run E2E tests
        run: go test -v ./tests/e2e/...

  # Матрица 2000 e2e (500/марш): 2000×~15с ≈ 8.3ч серийно → 8 шардов × 250
  # тестов, workers:4 (~16 мин/джоб). Дедупликация учитывает хэш тела,
  # параллельные воркеры не получают ложный 429.
  test-e2e-matrix:
    name: E2E matrix (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-store]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stair
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: stair_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend-store/package-lock.json
            frontend/package-lock.json

      - name: Install store dependencies
        run: npm ci
        working-directory: frontend-store

      # Vite dev отдаёт @shared-исходники из frontend/shared, а three/react
      # для них резолвятся через frontend/node_modules — без них падает
      # dependency scan и вьювер (install вместо ci: lock frontend/ отстаёт,
      # pre-existing drift).
      - name: Install shared deps (frontend)
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend-store

      - name: Run migrations
        run: |
          go run ./cmd/migrate up
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable

      - name: Start API server
        run: |
          go run ./cmd/api &
          sleep 5
        env:
          STAIR_DATABASE_URL: postgres://stair:testpassword@localhost:5432/stair_platform_test?sslmode=disable
          STAIR_HTTP_ADDR: :8080
          STAIR_SESSION_TTL: 86400
          # Матрица шлёт 2000 quote-расчётов параллельно (4 воркера/шард):
          # дефолтный лимит 30/мин на IP выбивает 429 и роняет кейсы.
          STAIR_QUOTE_RATE_LIMIT: 600

      - name: Run matrix shard ${{ matrix.shard }}/8
        run: npx playwright test e2e/tests/quote-matrix-generated.spec.ts --shard=${{ matrix.shard }}/8
        working-directory: frontend-store
        env:
          CI: true

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: frontend-store/blob-report
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend-store, test-frontend-admin]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Store
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/store.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/store:latest
            ghcr.io/${{ github.repository }}/store:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/admin.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/admin:latest
            ghcr.io/${{ github.repository }}/admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
