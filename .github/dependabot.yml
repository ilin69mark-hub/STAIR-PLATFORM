# Dependabot (P3): еженедельные PRs на обновление зависимостей.
# Закрывает пробел «нет зависимости от багов снабжения» — Go и оба npm-фронта.
# npm через корневые workspaces: один package-lock.json на frontend + frontend-store.
version: 2
updates:
  - package-ecosystem: gomod
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'go']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      otel:
        patterns: ['go.opentelemetry.io/*']

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'frontend']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vitest:
        patterns: ['vitest', '@vitest/*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'