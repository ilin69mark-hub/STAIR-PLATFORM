# Dependabot (P3): еженедельные PRs на обновление зависимостей.
# Закрывает пробел «нет зависимости от багов снабжения» — Go и оба npm-фронта.
version: 2
updates:
  - package-ecosystem: gomod
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'go']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      otel:
        patterns: ['go.opentelemetry.io/*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'frontend-admin']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']

  - package-ecosystem: npm
    directory: /frontend-store
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'frontend-store']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'