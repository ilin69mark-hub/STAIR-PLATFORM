  # Нестандартные RPC-маршруты с ":" в пути (см. x-rpc-routes) не могут быть ключами paths в OpenAPI 3.
x-rpc-routes:
  - "POST /stairs:calculate"
  - "POST /stairs:calculate/async"
  - "POST /stairs:optimize"
  - "POST /stairs:validate"
  - "POST /public/stairs:quote"
  - "POST /public/stairs:validate"
  - "POST /public/analytics:events"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: "bearer"
      description: "API-ключ (Authorization: Bearer) — EDR-0016"
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: "Сессионная cookie (httpOnly, SameSite=Strict); для admin — session_admin"
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "Double-submit CSRF: значение cookie csrf (csrf_admin) должно быть продублировано в этом заголовке для всех изменяющих запросов"
  headers:
    X-CSRF-Token:
      description: "CSRF-токен (double-submit, cookie csrf / csrf_admin)"
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "Машинный код ошибки (not_found, forbidden, validation_error, invalid_input, rates_not_allowed, csrf, internal и др.)"
            message:
              type: string
              description: Человекочитаемое сообщение
            request_id:
              type: string
              description: "Идентификатор запроса (только для 5xx)"
        request_id:
          type: string
          description: "Идентификатор запроса для поддержки"
    StairConfigInput:
      type: object
      required: [width_mm, height_mm, flight, step_height_mm, stringer_thickness_mm, step_thickness_mm, riser, clearance_mm, railing_height_mm]
      properties:
        width_mm:
          type: number
          format: double
        height_mm:
          type: number
          format: double
        flight:
          type: string
          enum: [straight, l_shape, u_shape, spiral]
        material:
          type: string
          enum: [STEEL-S235, WOOD-OAK, WOOD-WALNUT, WOOD-ASH, WOOD-SOFT]
        step_height_mm:
          type: number
          format: double
        stringer_thickness_mm:
          type: number
          format: double
        step_thickness_mm:
          type: number
          format: double
        riser:
          type: boolean
        clearance_mm:
          type: number
          format: double
        railing_height_mm:
          type: number
          format: double
        comfort_step_mm:
          type: number
          format: double
        landing_width_mm:
          type: number
          format: double
        landing_depth_mm:
          type: number
          format: double
        room_width_mm:
          type: number
          format: double
        room_length_mm:
          type: number
          format: double
        approach_space_mm:
          type: number
          format: double
        lower_step_count:
          type: integer
          format: int32
        outer_radius_mm:
          type: number
          format: double
        turn_kind:
          type: string
          enum: [platform, winder]
        winder_count:
          type: integer
          format: int32
        railing:
          type: string
          enum: [none, left, right, both]
        railing_lower:
          type: string
          enum: [none, left, right, both]
        railing_landing:
          type: string
          enum: [none, left, right, both]
        railing_upper:
          type: string
          enum: [none, left, right, both]
        direction:
          type: string
          enum: [left, right]
        spiral_direction:
          type: string
          enum: [cw, ccw]
        rates:
          type: object
          description: "Не принимается: цена считается только по серверным ставкам (SEC-001). Любое значение → 422 rates_not_allowed."
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        tenant_id:
          type: string
          format: uuid
    SubjectMe:
      type: object
      required: [subject_type]
      properties:
        subject_type:
          type: string
          enum: [user, api_key]
        user:
          $ref: "#/components/schemas/User"
        api_key:
          $ref: "#/components/schemas/ApiKey"
    ApiKey:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: "Сессионный токен. Дублирует httpOnly cookie session (session_admin) и нужен только небраузерным клиентам; CSRF-токен берётся из cookie csrf и дублируется в заголовке X-CSRF-Token"
    Material:
      type: object
      required: [code]
      properties:
        code:
          type: string
        name:
          type: string
        name_ru:
          type: string
        category:
          type: string
        density:
          type: number
        min_thickness:
          type: number
        max_thickness:
          type: number
        max_width_mm:
          type: number
        max_height_mm:
          type: number
    PaymentTier:
      type: object
      required: [id, price_minor, currency]
      properties:
        id:
          type: string
        title:
          type: string
        price_minor:
          type: integer
          format: int64
        currency:
          type: string
        features:
          type: array
          items:
            type: string
    AdminPayment:
      type: object
      required: [id, amount_minor, currency, status, provider, created_at]
      properties:
        id:
          type: string
          format: uuid
        tier_id:
          type: string
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        provider:
          type: string
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
    MaterialList:
      type: array
      items:
        $ref: "#/components/schemas/Material"
    PaymentTierList:
      type: array
      items:
        $ref: "#/components/schemas/PaymentTier"
    AdminPaymentList:
      type: array
      items:
        $ref: "#/components/schemas/AdminPayment"
