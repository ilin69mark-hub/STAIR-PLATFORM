# S5-1: CI smoke — end-to-end доставка алерта (Alertmanager → webhook → sink).
# Уберёт blackhole regression: если роут снова станет чёрной дырой/фиктивным,
# тест красный. Запуск (из корня репо):
#   docker compose -f deployments/observability/docker-compose.alerting-test.yml up -d
#   залить тестовый алерт, проверить лог sink — сценарий в CI-джобе test-alerting.
services:
  alert-sink:
    image: node:22-alpine
    container_name: stair-alert-sink-test
    command: ["node", "/srv/sink.js"]
    environment:
      SINK_LOG_FILE: /var/log/alert-sink.log
    volumes:
      - ./alert-sink/sink.js:/srv/sink.js:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: stair-alertmanager-test
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --cluster.listen-address=
      - --log.level=info
    volumes:
      - ./alertmanager/alertmanager.test.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      alert-sink:
        condition: service_started
    ports:
      - "19093:9093"