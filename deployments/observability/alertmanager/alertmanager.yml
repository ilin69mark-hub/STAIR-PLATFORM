# Alertmanager STAIR PLATFORM (INFRA-0021, S5-1 m2).
# Blackhole-роут убран: дефолтный receiver — webhook-доставка на alert-sink
# (локальный/dev-канал в observability compose). В проде URL `notify` меняется
# на реальный канал (Slack/Telegram/Grafana/webhook провайдера) — см.
# docs/17_INFRASTRUCTURE/21_ALERTING.md § Delivery.
route:
  receiver: notify
  group_by: [alertname, severity, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

inhibit_rules:
  # При недоступности API гасим производные latency/resource алерты.
  - source_matchers:
      - alertname = "StairApiDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: [service]

receivers:
  - name: notify
    webhook_configs:
      # alert-sink — см. docker-compose.observability.yml (dev/CI-канал).
      # Для продакшена заменить на реальный endpoint (email/telegram/slack).
      # AUDIT-EXCEPTION(E02): TG-канал заводит человек, см. docs/SECURITY_EXCEPTIONS.yml
      - url: "http://alert-sink:8099/hooks/stair-alerts"
        send_resolved: true