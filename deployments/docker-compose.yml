# STAIR PLATFORM — Local Development Stack
# DEV-0009: PostgreSQL + Redis for local development.
# Secrets are NOT stored in repository. Use .env.local for overrides.

name: stair-platform

services:
  postgres:
    image: postgres:16
    container_name: stair-platform-postgres
    environment:
      POSTGRES_USER: stair
      POSTGRES_PASSWORD: stair
      POSTGRES_DB: stair_platform
    ports:
      - "5432:5432"
    volumes:
      - stair-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stair -d stair_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: stair-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - stair-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: stair-platform-api
    container_name: stair-platform-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STAIR_DATABASE_URL: "postgres://stair:stair@postgres:5432/stair_platform?sslmode=disable"
      STAIR_HTTP_ADDR: ":8080"
      # Файловое хранилище (EDR-0026): корень должен быть доступен appuser.
      STAIR_STORAGE_DIR: "/tmp/storage"
      # Лимитеры (EDR-0014) щадящие для dev/e2e: регистрация и вход идут
      # из одного IP (localhost) параллельно из нескольких тестов.
      STAIR_REGISTER_RATE_LIMIT: "500"
      STAIR_LOGIN_RATE_LIMIT: "1000"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  stair-postgres-data:
  stair-redis-data: