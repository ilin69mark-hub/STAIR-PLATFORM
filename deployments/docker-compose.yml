# STAIR PLATFORM — Local Development Stack
# DEV-0009: PostgreSQL + Redis for local development.
# Secrets are loaded from .env file. Copy .env.example to .env and configure.

name: stair-platform

services:
  postgres:
    image: postgres:16
    container_name: stair-platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stair_platform}
    ports:
      - "5432:5432"
    volumes:
      - stair-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stair} -d ${POSTGRES_DB:-stair_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: stair-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - stair-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: stair-platform-api
    container_name: stair-platform-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STAIR_DATABASE_URL: "postgres://${POSTGRES_USER:-stair}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-stair_platform}?sslmode=disable"
      STAIR_REDIS_ADDR: "redis:6379"
      STAIR_HTTP_ADDR: ":8080"
      STAIR_STORAGE_DIR: "/tmp/storage"
      STAIR_REGISTER_RATE_LIMIT: "5000"
      STAIR_LOGIN_RATE_LIMIT: "10000"
      STAIR_VALIDATE_RATE_LIMIT: "10000"
      STAIR_AUTH_RATE_LIMIT: "10000"
      STAIR_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:5174"
      STAIR_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: stair-platform-worker
    container_name: stair-platform-worker
    entrypoint: ["/bin/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      STAIR_DATABASE_URL: "postgres://${POSTGRES_USER:-stair}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-stair_platform}?sslmode=disable"
      STAIR_REDIS_ADDR: "redis:6379"
      STAIR_WORKER_SHUTDOWN_TIMEOUT: ${STAIR_WORKER_SHUTDOWN_TIMEOUT:-10s}
      STAIR_CLEANUP_INTERVAL: ${STAIR_CLEANUP_INTERVAL:-1h}
      STAIR_AUDIT_RETENTION_DAYS: ${STAIR_AUDIT_RETENTION_DAYS:-90}
    restart: unless-stopped

  store:
    build:
      context: ..
      dockerfile: deployments/store.Dockerfile
    image: stair-platform-store
    container_name: stair-platform-store
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: deployments/admin.Dockerfile
    image: stair-platform-admin
    container_name: stair-platform-admin
    depends_on:
      api:
        condition: service_started
    ports:
      - "5174:80"
    restart: unless-stopped

volumes:
  stair-postgres-data:
  stair-redis-data: