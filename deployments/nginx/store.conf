# Клиентский сайт (store): статика + прокси /api и /ws на Go API.
server {
    listen 80;
    server_name _;

    # S-121: не светить версию в Server-заголовке и error-страницах.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # S-121: базовые security-заголовки (always — в т.ч. на 4xx/5xx и
    # проксированных ответах). CSP: same-origin + inline-стили Vite
    # ('unsafe-inline' для style) + data:/blob: для ассетов/three.js;
    # connect-src явно разрешает ws:/wss: апгрейды на тот же хост.
    # Магазин-витрину не фреймим чужими сайтами, но SAMEORIGIN оставляем
    # для легитимных same-origin вставок (админка — строже, см. admin.conf).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: все маршруты отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси API к контейнеру stair-platform-api (:8080).
    # changeOrigin=off сохраняет Host браузера для CSRF-проверки (EDR-0014).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # S-121: WebSocket realtime (store → /ws; см. S-132). Префикс /ws
    # покрывает и /ws/admin (админка ходит через свой origin, путь тот же).
    # Upgrade/Connection обязательны для 101 Switching Protocols; долгий
    # read_timeout — держать idle-соединения комнат.
    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Кэш статики с хешированными именами.
    # NOTE: add_header в location перекрывает server-уровень (квирк nginx),
    # поэтому security-заголовки продублированы здесь (S-121).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
