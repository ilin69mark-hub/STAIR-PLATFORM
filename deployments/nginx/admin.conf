# Админ-панель (frontend): статика + прокси /api и /ws на Go API.
server {
    # AUDIT-EXCEPTION(E08): UFW/firewall — человек, см. docs/SECURITY_EXCEPTIONS.yml
    # AUDIT-EXCEPTION(E09): TLS/certbot — человек, см. docs/SECURITY_EXCEPTIONS.yml
    listen 80;
    server_name _;

    # S-121: не светить версию в Server-заголовке и error-страницах.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Резолвим имя контейнера api на КАЖДЫЙ запрос, а не один раз при старте
    # nginx (S-156): docker пересоздаёт контейнер и меняет его IP, а nginx
    # держит старый адрес и отдаёт 502 «Connection refused» на живом стенде.
    # Переменная в proxy_pass заставляет nginx спрашивать Docker DNS заново.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Внятная страница вместо стандартной nginx-страницы на английском.
    # Её видит человек, когда API недоступен: сказать «сервис временно
    # недоступен, попробуйте через минуту» полезнее, чем «502 Bad Gateway».
    error_page 502 503 504 = @api_unavailable;

    location @api_unavailable {
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Retry-After "30" always;
        return 503 '<!doctype html><html lang="ru"><head><meta charset="utf-8">
<title>Сервис недоступен</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;
justify-content:center;margin:0;padding:24px}
.box{max-width:520px}h1{font-size:22px;margin:0 0 12px}
p{line-height:1.6;color:#94a3b8;margin:0 0 8px}
code{background:#1e293b;padding:2px 6px;border-radius:4px;font-size:13px}
.o{color:#f97316;font-weight:600}</style></head><body><div class="box">
<h1><span class="o">Сервис недоступен</span></h1>
<p>Не удалось связаться с сервером приложения. Обычно это значит, что он
перезапускается или ещё не поднялся.</p>
<p>Подождите минуту и обновите страницу. Если не помогло — сообщите
администратору: проверьте <code>docker compose ps</code> и
<code>docker compose logs api</code>.</p>
<p>Номер запроса: <code>$request_id</code></p>
</div></body></html>';
    }

    # S-121: базовые security-заголовки (always — в т.ч. на 4xx/5xx и
    # проксированных ответах). CSP как в store; админка строже: DENY
    # фрейминга (кликджекинг привилегированного UI недопустим).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: все маршруты отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси API к контейнеру stair-platform-api (:8080).
    # changeOrigin=off сохраняет Host браузера для CSRF-проверки (EDR-0014).
    location /api/ {
        # Адрес передаём переменной: см. resolver выше — так адрес
        # перечитывается на каждом запросе, а не запоминается при старте.
        # Путь указываем явно ($request_uri), потому что с переменной nginx
        # URI сам не подставит.
        set $api_upstream "api:8080";
        # Полный исходный путь, включая /api: бэкенд маршрутизирует
        # именно /api/v1/... и на /v1/... отвечает 405. Префикс НЕ срезаем.
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # S-121: WebSocket realtime (admin → /ws/admin; см. S-119/S-132).
    # Префикс /ws покрывает /ws и /ws/admin. Upgrade/Connection обязательны
    # для 101 Switching Protocols; долгий read_timeout — idle комнат.
    location /ws {
        # Адрес передаём переменной: см. resolver выше — так адрес
        # перечитывается на каждом запросе, а не запоминается при старте.
        # Путь указываем явно ($request_uri), потому что с переменной nginx
        # URI сам не подставит.
        set $api_upstream "api:8080";
        # Полный исходный путь, включая /api: бэкенд маршрутизирует
        # именно /api/v1/... и на /v1/... отвечает 405. Префикс НЕ срезаем.
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Кэш статики с хешированными именами.
    # NOTE: add_header в location перекрывает server-уровень (квирк nginx),
    # поэтому security-заголовки продублированы здесь (S-121).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
