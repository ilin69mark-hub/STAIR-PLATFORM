# Админ-панель (frontend): статика + прокси /api на Go API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все маршруты отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси API к контейнеру stair-platform-api (:8080).
    # changeOrigin=off сохраняет Host браузера для CSRF-проверки (EDR-0014).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Кэш статики с хешированными именами.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
